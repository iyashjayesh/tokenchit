<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="tokenchit">
  <!--
    The wordmark badge, reduced to what survives at 16px.

    The site's signature is a lime plate with a hard ink offset shadow — every element on the
    page carries one. At favicon size the shadow is what reads: two overlapping squares are
    still distinguishable when the letterform inside them is not, so the mark is the plate and
    its shadow first, and the "t" second.

    Drawn as rectangles rather than set in the display face: a favicon has no fonts, and a
    stem-and-crossbar "t" at this size is more legible than any glyph would be anyway.

    Geometry is assets/logo.svg scaled to this 32-unit box, so the favicon and the logo are the
    same mark rather than two drawings that drift. The earlier version centred the stem in its
    crossbar, which is fine here and reads as a plus sign at any size a logo is used at.
  -->
  <rect x="7" y="7" width="23" height="23" fill="#0B0B09"/>
  <rect x="2" y="2" width="23" height="23" fill="#C6FF3D" stroke="#0B0B09" stroke-width="2.5"/>
  <rect x="11.4" y="7.5" width="3.3" height="13.8" fill="#0B0B09"/>
  <rect x="8.7" y="10" width="9" height="3.1" fill="#0B0B09"/>
  <rect x="14.4" y="18" width="3.6" height="3.1" fill="#0B0B09"/>
</svg>
